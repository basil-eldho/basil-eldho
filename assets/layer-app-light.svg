<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 50" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<style>svg{color:#34322b}.g{fill:#ffffff}.hot{stroke:#b03a1c}text{fill:#58554c;stroke:none;font-family:"Source Serif 4",Charter,Georgia,serif;font-style:italic}.ink{fill:currentColor;stroke:none}
@media (prefers-reduced-motion: no-preference) {
  svg * { --at: calc(var(--s, 0) * 1.6s + 100ms); --for: calc(var(--d, 0.2) * 1.6s); }
  [pathLength] { stroke-dasharray: 1 2; stroke-dashoffset: 1.01;
    animation: draw var(--for) cubic-bezier(.3,.1,.6,1) var(--at) forwards; }
  .hot[pathLength] { animation: draw var(--for) cubic-bezier(.3,.1,.6,1) var(--at) forwards,
    pulse 1.6s ease-in-out calc(var(--at) + var(--for)) 3; }
  .ink, text, [stroke-dasharray]:not([pathLength]) { opacity: 0;
    animation: fade max(var(--for), .3s) ease-out var(--at) forwards; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@keyframes pulse { 50% { opacity: .35; } }
</style>
